<!DOCTYPE html>
<html lang="ms" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Himpunan Doa - Koleksi Doa Harian</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            poppins: ['Poppins', 'sans-serif'],
          },
          colors: {
            neonPink: '#ff007f',
            neonCyan: '#00f0ff',
            darkBg: '#08090d',
            cardBg: 'rgba(20, 21, 33, 0.65)',
          },
          boxShadow: {
            neon: '0 0 15px rgba(255, 0, 127, 0.4), inset 0 0 15px rgba(255, 0, 127, 0.1)',
            neonCyan: '0 0 15px rgba(0, 240, 255, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.1)',
            glow: '0 0 25px rgba(255, 0, 127, 0.6)',
          }
        }
      }
    }
  </script>
  <!-- Google Fonts: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at 50% 10%, #1a0b2e 0%, #08090d 70%);
      color: #f3f4f6;
      min-height: 100vh;
    }
    .glass {
      background: rgba(20, 21, 33, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 0, 127, 0.25);
    }
    .glass-card {
      background: rgba(18, 20, 32, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 0, 127, 0.18);
      transition: all 0.3s ease;
    }
    .glass-card:hover {
      border-color: rgba(255, 0, 127, 0.6);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
      transform: translateY(-2px);
    }
    ::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #08090d;
    }
    ::-webkit-scrollbar-thumb {
      background: #ff007f;
      border-radius: 3px;
    }
  </style>
</head>
<body class="selection:bg-neonPink selection:text-white pb-12">

  <!-- Header / Navbar -->
  <header class="sticky top-0 z-40 glass border-b border-pink-500/20 px-4 py-3 sm:px-8">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-neonPink to-neonCyan flex items-center justify-center shadow-neon">
          <i class="fa-solid fa-hands-praying text-white text-lg"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wider bg-gradient-to-r from-neonPink via-pink-400 to-neonCyan bg-clip-text text-transparent">🤲 HIMPUNAN DOA</h1>
          <p class="text-xs text-gray-400">✨ Koleksi Doa Harian & Zikir Pilihan</p>
        </div>
      </div>

      <!-- Search Bar & 3-dot Menu -->
      <div class="w-full sm:w-auto flex items-center gap-2">
        <!-- 3-Dot Mini Menu Button -->
        <div class="relative">
          <button onclick="toggleCategoryMenu()" class="glass-card px-3 py-2 rounded-xl text-gray-300 hover:text-white transition-all flex items-center justify-center h-10 w-10 border border-pink-500/30 hover:border-neonPink shadow-neon" title="Pilih Kategori">
            <i class="fa-solid fa-ellipsis-vertical text-base"></i>
          </button>

          <!-- Dropdown Menu -->
          <div id="categoryDropdown" class="absolute left-0 mt-2 w-52 glass rounded-2xl p-2 shadow-glow hidden z-50 border border-pink-500/40 backdrop-blur-xl">
            <div class="text-[10px] uppercase tracking-wider text-gray-400 px-3 py-1.5 font-semibold border-b border-pink-500/20 mb-1 flex items-center justify-between">
              <span>📁 Kategori Doa</span>
              <span id="activeCategoryBadge" class="text-neonPink text-[9px]">Semua</span>
            </div>
            <button onclick="selectCategory('Semua')" class="w-full text-left px-3 py-2 rounded-xl text-[11px] text-gray-200 hover:bg-pink-500/20 hover:text-white transition-all flex items-center gap-2.5"><i class="fa-solid fa-list w-4 text-neonPink"></i> Semua</button>
            <button onclick="selectCategory('Harian')" class="w-full text-left px-3 py-2 rounded-xl text-[11px] text-gray-200 hover:bg-pink-500/20 hover:text-white transition-all flex items-center gap-2.5"><i class="fa-solid fa-sun w-4 text-neonPink"></i> Harian</button>
            <button onclick="selectCategory('Perlindungan')" class="w-full text-left px-3 py-2 rounded-xl text-[11px] text-gray-200 hover:bg-pink-500/20 hover:text-white transition-all flex items-center gap-2.5"><i class="fa-solid fa-shield-halved w-4 text-neonPink"></i> Perlindungan</button>
            <button onclick="selectCategory('Kesihatan')" class="w-full text-left px-3 py-2 rounded-xl text-[11px] text-gray-200 hover:bg-pink-500/20 hover:text-white transition-all flex items-center gap-2.5"><i class="fa-solid fa-heart-pulse w-4 text-neonPink"></i> Kesihatan</button>
            <button onclick="selectCategory('Ilmu')" class="w-full text-left px-3 py-2 rounded-xl text-[11px] text-gray-200 hover:bg-pink-500/20 hover:text-white transition-all flex items-center gap-2.5"><i class="fa-solid fa-book-quran w-4 text-neonPink"></i> Ilmu</button>
            <button onclick="selectCategory('Wirid')" class="w-full text-left px-3 py-2 rounded-xl text-[11px] text-gray-200 hover:bg-pink-500/20 hover:text-white transition-all flex items-center gap-2.5"><i class="fa-solid fa-bookmark w-4 text-neonPink"></i> Wirid</button>
            <button onclick="selectCategory('Istigfar')" class="w-full text-left px-3 py-2 rounded-xl text-[11px] text-gray-200 hover:bg-pink-500/20 hover:text-white transition-all flex items-center gap-2.5"><i class="fa-solid fa-hands-bubbles w-4 text-neonPink"></i> Istigfar</button>
            <button onclick="selectCategory('Majlis')" class="w-full text-left px-3 py-2 rounded-xl text-[11px] text-gray-200 hover:bg-pink-500/20 hover:text-white transition-all flex items-center gap-2.5"><i class="fa-solid fa-people-group w-4 text-neonPink"></i> Majlis</button>
            <button onclick="selectCategory('Bacaan Solat')" class="w-full text-left px-3 py-2 rounded-xl text-[11px] text-gray-200 hover:bg-pink-500/20 hover:text-white transition-all flex items-center gap-2.5"><i class="fa-solid fa-person-praying w-4 text-neonPink"></i> Bacaan Solat</button>
            <div class="relative">
              <button onclick="selectCategory('Niat Solat')" class="w-full text-left px-3 py-2 rounded-xl text-[11px] text-gray-200 hover:bg-pink-500/20 hover:text-white transition-all flex items-center justify-between">
                <span class="flex items-center gap-2.5"><i class="fa-solid fa-kaaba w-4 text-neonPink"></i> Niat Solat</span>
                <i class="fa-solid fa-chevron-down text-[10px] text-gray-400 hover:text-white p-1" onclick="toggleSubmenu(event)"></i>
              </button>
              <div id="niatSolatSubmenu" class="pl-4 space-y-1 hidden my-1 border-l border-pink-500/20 ml-3">
                <button onclick="selectCategory('Solat Fardu')" class="w-full text-left px-3 py-1.5 rounded-xl text-[11px] text-gray-300 hover:bg-pink-500/20 hover:text-white transition-all flex items-center gap-2"><i class="fa-solid fa-circle text-[6px] text-neonPink"></i> Solat Fardu</button>
                <button onclick="selectCategory('Solat Sunat')" class="w-full text-left px-3 py-1.5 rounded-xl text-[11px] text-gray-300 hover:bg-pink-500/20 hover:text-white transition-all flex items-center gap-2"><i class="fa-solid fa-circle text-[6px] text-neonPink"></i> Solat Sunat</button>
                <button onclick="selectCategory('Rawatib')" class="w-full text-left px-3 py-1.5 rounded-xl text-[11px] text-gray-300 hover:bg-pink-500/20 hover:text-white transition-all flex items-center gap-2"><i class="fa-solid fa-circle text-[6px] text-neonPink"></i> Rawatib</button>
              </div>
            </div>
            <button onclick="selectCategory('Favorit')" class="w-full text-left px-3 py-2 rounded-xl text-[11px] text-pink-400 hover:bg-pink-500/20 hover:text-pink-300 transition-all flex items-center gap-2.5 border-t border-pink-500/20 mt-1 pt-2"><i class="fa-solid fa-star w-4"></i> Favorit</button>
          </div>
        </div>

        <div class="relative flex-1 sm:w-64">
          <input type="text" id="searchInput" placeholder="🔍 Cari doa..." class="w-full bg-black/40 border border-pink-500/30 rounded-xl px-4 py-2 text-[11px] text-gray-200 placeholder-gray-500 focus:outline-none focus:border-neonPink focus:ring-1 focus:ring-neonPink transition-all">
          <span class="absolute right-3 top-2.5 text-gray-400">
            <i class="fa-solid fa-search"></i>
          </span>
        </div>

        <!-- Credit Info Button with 'i' symbol -->
        <a href="credit.html" class="glass-card px-3 py-2 rounded-xl text-yellow-400 hover:text-white transition-all flex items-center justify-center h-10 w-10 border border-yellow-500/30 hover:border-yellow-400 shadow-neon" title="Kredit">
          <span class="font-bold text-base font-mono">i</span>
        </a>

        <!-- Admin Dashboard Button -->
        <a href="admin.html" class="glass-card px-3 py-2 rounded-xl text-neonCyan hover:text-white transition-all flex items-center justify-center h-10 w-10 border border-cyan-500/30 hover:border-neonCyan shadow-neonCyan" title="Admin Dashboard">
          <i class="fa-solid fa-gear text-base"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-4 mt-6">

    <!-- Side-scroll Page Numbers Pagination (Top) -->
    <div id="paginationContainer" class="flex items-center gap-2 overflow-x-auto pb-3 mb-4 no-scrollbar hidden">
      <!-- Injected via JS -->
    </div>

    <!-- Duas Grid -->
    <div id="duasContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Dynamic Duas injected via JS -->
    </div>

    <!-- Side-scroll Page Numbers Pagination (Bottom) -->
    <div id="bottomPaginationContainer" class="flex items-center gap-2 overflow-x-auto pt-6 pb-3 no-scrollbar hidden">
      <!-- Injected via JS -->
    </div>
  </main>

  <!-- Frosted Glass Popup Modal -->
  <div id="duaModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
    <div class="glass max-w-2xl w-full max-h-[90vh] overflow-y-auto rounded-3xl p-6 sm:p-8 relative border border-pink-500/50 shadow-glow transform scale-95 transition-transform duration-300" id="modalContentBox">

      <!-- Close Button -->
      <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-neonPink bg-white/5 hover:bg-white/10 p-2.5 rounded-xl transition-all">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <!-- Modal Header -->
      <div class="flex items-center justify-between mb-4 pr-10">
        <div>
          <span id="modalCategory" class="text-[10px] uppercase tracking-widest px-2.5 py-1 rounded-lg bg-pink-500/10 text-pink-400 border border-pink-500/20 font-semibold">Kategori</span>
          <h2 id="modalTitle" class="text-xl sm:text-2xl font-bold text-white mt-2">Tajuk Doa</h2>
          <div class="mt-1">
            <span id="modalSource" class="text-[10px] text-neonCyan font-medium bg-cyan-950/40 px-2 py-0.5 rounded border border-cyan-500/20 inline-block"><i class="fa-solid fa-book-bookmark mr-1"></i> Sumber</span>
          </div>
        </div>
      </div>

      <!-- Toggle Buttons -->
      <div class="flex items-center flex-wrap gap-2 mb-4 pb-3 border-b border-pink-500/10">
        <button onclick="toggleModalSection('source')" id="toggleSourceBtn" class="glass-card px-3 py-1.5 rounded-lg text-[10px] font-semibold text-neonCyan border-cyan-500/30 hover:bg-cyan-500/20 transition-all flex items-center gap-1.5" title="Toggle Sumber">
          <i class="fa-solid fa-book-bookmark"></i> Sumber
        </button>
        <button onclick="toggleModalSection('definition')" id="toggleDefBtn" class="glass-card px-3 py-1.5 rounded-lg text-[10px] font-semibold text-white border-pink-500/30 hover:bg-pink-500/20 transition-all flex items-center gap-1.5" title="Toggle Definisi">
          <i class="fa-solid fa-circle-info"></i> Definisi
        </button>
        <button onclick="toggleModalSection('rumi')" id="toggleRumiBtn" class="glass-card px-3 py-1.5 rounded-lg text-[10px] font-semibold text-yellow-400 border-yellow-500/30 hover:bg-yellow-500/20 transition-all flex items-center gap-1.5" title="Toggle Bacaan Rumi">
          <i class="fa-solid fa-font"></i> Rumi
        </button>
        <button onclick="toggleModalSection('meaning')" id="toggleMeaningBtn" class="glass-card px-3 py-1.5 rounded-lg text-[10px] font-semibold text-pink-400 border-pink-500/30 hover:bg-pink-500/20 transition-all flex items-center gap-1.5" title="Toggle Maksud">
          <i class="fa-solid fa-language"></i> Maksud
        </button>
        <button onclick="toggleModalSection('fadhilat')" id="toggleFadhilatBtn" class="glass-card px-3 py-1.5 rounded-lg text-[10px] font-semibold text-yellow-300 border-yellow-500/30 hover:bg-yellow-500/20 transition-all flex items-center gap-1.5" title="Toggle Fadhilat">
          <i class="fa-solid fa-star"></i> Fadhilat
        </button>
      </div>

      <!-- Arabic Text (18px white) -->
      <div id="modalArabicSection" class="bg-black/50 border border-pink-500/30 rounded-2xl p-5 mb-4 text-right shadow-inner">
        <p id="modalArabic" class="text-[18px] font-arabic text-white leading-loose"></p>
      </div>

      <!-- Bacaan Rumi Text (12px yellow) -->
      <div id="modalRumiSection" class="mb-4">
        <span id="modalRumiLabel" class="text-[10px] text-neonCyan font-semibold uppercase tracking-wider block mb-1"><i class="fa-solid fa-font mr-1"></i> Bacaan Rumi</span>
        <p id="modalRumi" class="text-[12px] text-yellow-400 italic font-light leading-relaxed whitespace-pre-line"></p>
      </div>

      <!-- Meaning (12px) -->
      <div class="mb-6">
        <div id="modalMeaningBlock">
          <span id="modalMeaningLabel" class="text-[10px] text-neonPink font-semibold uppercase tracking-wider block mb-1"><i class="fa-solid fa-language mr-1"></i> Maksud</span>
          <p id="modalMeaning" class="text-[12px] text-gray-300 leading-relaxed"></p>
        </div>
        <div id="modalDefinitionSection">
          <p id="modalRawatibDef" class="text-[12px] text-white mt-2 hidden"></p>
        </div>

        <!-- Fadhilat Section (10px) -->
        <div id="modalFadhilatContainer" class="mt-4 pt-3 border-t border-pink-500/20 hidden">
          <span id="modalFadhilatLabel" class="text-[10px] text-yellow-400 font-semibold uppercase tracking-wider block mb-1"><i class="fa-solid fa-star mr-1"></i> Fadhilat</span>
          <p id="modalFadhilatText" class="text-[10px] text-yellow-400 leading-relaxed whitespace-pre-line"></p>
        </div>
      </div>

      <!-- Modal Actions -->
      <div class="flex items-center justify-end gap-3 pt-4 border-t border-pink-500/20">
        <button id="modalFavBtn" onclick="toggleBookmarkCurrent()" class="px-4 py-2 rounded-xl text-xs font-semibold glass-card text-pink-400 hover:bg-pink-500/20 transition-all flex items-center gap-2">
          <span id="modalFavIcon"><i class="fa-regular fa-star"></i></span> Simpan Favorit
        </button>
        <button id="modalCopyBtn" onclick="copyCurrentDua()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-gradient-to-r from-neonPink to-purple-600 text-white shadow-neon hover:opacity-90 transition-all flex items-center gap-2">
          <i class="fa-regular fa-copy"></i> Salin Doa
        </button>
      </div>
    </div>
  </div>

  <!-- Script logic -->
  <script src="script.js?v=999"></script>

  <!-- Footer Copyright -->
  <footer class="max-w-4xl mx-auto px-4 mt-12 text-center text-[10px] text-gray-500 border-t border-pink-500/10 pt-4">
    <p>Himpunan Doa &copy; 2026. Hamba Allah SWT.</p>
    <p class="mt-1 font-mono text-neonPink font-semibold" id="appVersion">v1.1126.03</p>
  </footer>
</body>
</html>
